name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

cache-mode: none

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Publish latest image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          install: true
          cache: true

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build image
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            spring-boot:build-image \
            -Dspring-boot.build-image.imageName="${IMAGE_NAME}" \
            -Dspring-boot.build-image.imageTags="latest,${GITHUB_SHA}"

      - name: Push image
        run: docker push --all-tags "${IMAGE_NAME}"